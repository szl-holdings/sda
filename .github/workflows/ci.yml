name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Prove exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_REVISION"
          echo "Qualified exact source $actual"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pytest==9.0.2" "huggingface_hub==0.36.0"
      - name: Compile Python
        run: python -m compileall -q server.py szl_source_attestation.py scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Validate deploy binding builder
        run: |
          python - <<'PY'
          from scripts.hf_space_deploy import source_binding
          binding = source_binding("szl-holdings/sda", "a" * 40)
          assert binding["source_revision"] == "a" * 40
          assert binding["relation"] == "exact-runtime-file-set"
          print("source binding validation passed")
          PY
