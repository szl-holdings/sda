name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "Dockerfile"
      - "LICENSE"
      - "README.md"
      - "SPACE_PROVENANCE.json"
      - "index.html"
      - "server.py"
      - "szl_source_attestation.py"
      - "scripts/hf_space_deploy.py"
      - "scripts/hf_space_drift_check.py"
      - ".github/workflows/hf-space-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sda-hf-space-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact deployment client
        run: python -m pip install "huggingface_hub==0.36.0"
      - name: Publish exact runtime file set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          python scripts/hf_space_deploy.py --token "$HF_TOKEN"
      - name: Verify live bytes and source binding
        run: python scripts/hf_space_drift_check.py --source-revision "$GITHUB_SHA"
